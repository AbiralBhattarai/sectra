[project]
name = "sectra-poster"
version = "0.1.0"
description = "Posts Sectra's outbox clips to YouTube Shorts, TikTok, Instagram and Facebook Reels with Playwright"
requires-python = ">=3.12,<3.14"
dependencies = ["playwright>=1.50"]

[project.scripts]
poster = "poster.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poster"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
